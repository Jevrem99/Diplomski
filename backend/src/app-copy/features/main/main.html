<!-- Glavni omotač -->
<div class="main-wrapper flex flex-col lg:flex-row min-h-screen w-full bg-[#f4f7fb] p-3 sm:p-4 md:p-6 gap-4 md:gap-6">
  
  <!-- LEVI PANEL (Banka Predmeta) -->
  <aside class="w-full lg:w-80 flex flex-col bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden shrink-0 max-h-[300px] lg:max-h-none">
    <div class="p-4 sm:p-5 border-b border-gray-100">
      <h2 class="text-base sm:text-lg font-bold text-gray-800">Banka predmeta</h2>
      <p class="text-xs text-gray-500 mt-0.5">Prevuci predmet na željeni datum</p>
      <div class="relative mt-3">
        <input type="text" placeholder="Pretraži predmete..." class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-[#34b9f7]/50 focus:border-transparent transition-all">
        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>

    <!-- Lista predmeta iz baze -->
    <div class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-2.5 sm:space-y-3" #draggableContainer>
      @for (predmet of predmeti; track predmet.id) {
        <div class="fc-event group cursor-grab active:cursor-grabbing p-3 sm:p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-150 flex flex-col gap-1 relative overflow-hidden select-none" [attr.data-godina]="predmet.godina" [attr.data-id]="predmet.id">
          <!-- Leva trakica u boji godine -->
          <div class="absolute left-0 top-0 bottom-0 w-1.5" [style.background-color]="getGodinaColor(predmet.godina)"></div>
          <h3 class="font-bold text-xs sm:text-sm text-gray-800 transition-colors">
            {{ predmet.naziv }}
          </h3>
          <p class="text-[11px] sm:text-xs text-gray-500 font-medium">
            {{ predmet.profesorImePrezime }}
          </p>
          <div class="mt-0.5">
            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold" [style.color]="getGodinaColor(predmet.godina)" [style.background-color]="getGodinaColor(predmet.godina) + '1A'">
              {{ predmet.godina }}. Godina
            </span>
          </div>
        </div>
      } @empty {
        <p class="text-xs text-gray-400 text-center py-4">Nema dostupnih predmeta u bazi.</p>
      }
    </div>
  </aside>

  <!-- DESNI PANEL (Kalendar Oblast) -->
  <main class="flex-1 flex flex-col min-w-0 w-full">
    <!-- Akciona Gornja Traka -->
    <header class="mb-4 sm:mb-6 p-3 sm:p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between bg-white rounded-2xl shadow-sm border border-gray-100 gap-3 sm:gap-4">
      <!-- Naslov + Zastavica -->
      <div class="flex flex-wrap items-center justify-between sm:justify-start gap-2 sm:gap-4">
        <h1 class="text-lg sm:text-xl font-bold text-gray-800 tracking-tight">Raspored Kolokvijuma</h1>
        @if (hasUnsavedChanges) {
          <span class="px-2.5 py-1 bg-amber-50 border border-amber-100 text-amber-600 text-[11px] sm:text-xs font-bold rounded-full flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span>
            Nesačuvane izmene
          </span>
        }
      </div>

      <!-- FILTERI I AKCIJE -->
      <div class="flex flex-wrap items-center justify-between md:justify-end gap-2 sm:gap-3">
        <div class="flex items-center gap-2">
          <select [(ngModel)]="filterGodina" (change)="applyFilters()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs sm:text-sm font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#34b9f7]/50">
            <option value="sve">Sve godine</option>
            <option value="1">1. Godina</option>
            <option value="2">2. Godina</option>
            <option value="3">3. Godina</option>
            <option value="4">4. Godina</option>
          </select>

          <select [(ngModel)]="filterSala" (change)="applyFilters()" class="px-2.5 py-1.5 sm:px-3 sm:py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs sm:text-sm font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#34b9f7]/50">
            <option value="sve">Sve sale</option>
            @for (sala of dostupneSale; track sala) {
              <option [value]="sala">{{ sala }}</option>
            }
          </select>
        </div>

        <div class="flex items-center gap-2">
          <button (click)="exportToPrintView()" class="px-3 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold text-gray-700 bg-gray-100 border border-gray-200 rounded-xl hover:bg-gray-200 transition-all flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
            </svg>
            <span class="hidden sm:inline">Izvezi</span>
          </button>

          <button (click)="saveDraftSchedule()" class="px-3 py-1.5 sm:px-5 sm:py-2 text-xs sm:text-sm font-bold text-white bg-[#34b9f7] rounded-xl hover:bg-[#20a6e4] transition-all shadow-md">
            Sačuvaj
          </button>
        </div>
      </div>
    </header>

    <!-- Kontejner za Kalendar: DODATA FIKSNA VISINA `h-[600px]` KADA JE EKRAN MANJI OD 1025px -->
    <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-3 sm:p-5 flex flex-col h-[650px] lg:h-full min-h-[550px]">
      <full-calendar #calendar [options]="calendarOptions" class="h-full w-full flex-1"></full-calendar>
    </div>
  </main>
</div>
