@if (toastService.showToast()) {
  <div class="fixed bottom-8 right-8 z-[9999] flex items-center gap-3 px-5 py-4 bg-white border border-gray-100 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.08)] transition-all"
       [class.border-l-4]="true"
       [class.border-l-[#34b9f7]]="toastService.type() === 'success'"
       [class.border-l-red-500]="toastService.type() === 'error'">
    
    @if (toastService.type() === 'success') {
      <div class="w-8 h-8 rounded-full bg-[#34b9f7]/10 flex items-center justify-center text-[#34b9f7]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    } @else {
      <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-red-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
    }
    
    <span class="text-sm font-bold text-gray-800">{{ toastService.message() }}</span>
  </div>
}
