server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: /api/ispit  ->  backend:5000/ispit  (isti domen, pa nema problema sa CORS-om)
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # uvoz Excel fajla (backend dozvoljava 10 MB)
        proxy_read_timeout 180s;    # IMI sinhronizacija i izvozi mogu da traju
    }

    # Fajlovi sa hešom u imenu se ne menjaju, pa ih pregledač sme dugo da čuva
    location ~* \.(js|css|woff2?|png|svg|ico|jpg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular rute (/main, /login, /auth/callback ...) nisu pravi fajlovi: uvek vrati index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
