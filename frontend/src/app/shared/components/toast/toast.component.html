@if (toastService.showToast()) {
  <div class="fixed bottom-6 right-6 z-[99999] flex items-center gap-3 px-4 py-3 bg-white border border-slate-200 rounded-xl shadow-xl transition-all font-montserrat"
       [class.border-l-4]="true"
       [class.border-l-[#1F63A0]]="toastService.type() === 'success'"
       [class.border-l-red-500]="toastService.type() === 'error'">
    
    @if (toastService.type() === 'success') {
      <div class="w-7 h-7 rounded-full bg-[#1F63A0] flex items-center justify-center text-white shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
    } @else {
      <div class="w-7 h-7 rounded-full bg-red-500 flex items-center justify-center text-white shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
    }
    
    <span class="text-xs sm:text-sm font-bold text-slate-800">{{ toastService.message() }}</span>
  </div>
}
