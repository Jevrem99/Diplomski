<div class="login-wrapper">
  <!-- Pozadinski ukrasni elementi za glassmorphism efekat -->
  <div class="bg-shape circle-1"></div>
  <div class="bg-shape circle-2"></div>

  <div class="login-card">
    <!-- Logo i Naslov -->
    <div class="header-section">
      <img ngSrc="assets/logopmf.png" width="80" height="80" class="logo-image" alt="PMF Logo" priority>
      <h1 class="portal-title">Sistem za Raspored Ispita</h1>
      <p class="portal-subtitle">Institut za matematiku i informatiku</p>
    </div>

    <!-- Polja za prijavu -->
    <form class="form-fields" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline" class="custom-field">
        <mat-label>Korisničko ime ili email</mat-label>
        <input matInput id="usernameInput" placeholder="ime@primer.com" autofocus [(ngModel)]="loginData.username" name="username" required>
        <mat-icon matSuffix class="field-icon">person_outline</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="custom-field">
        <mat-label>Lozinka</mat-label>
        <input matInput id="passwordInput" [type]="hide ? 'password' : 'text'" placeholder="••••••••" [(ngModel)]="loginData.password" name="password" required>
        <button 
          mat-icon-button 
          matSuffix 
          (click)="hide = !hide" 
          [attr.aria-label]="'Hide password'" 
          [attr.aria-pressed]="hide"
          type="button">
          <mat-icon class="field-icon">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <button type="submit" class="submit-button">
        Prijavi se
      </button>
    </form>
  </div>
</div>
