<!-- Glavni omotač -->
<div class="flex h-[94vh] w-full bg-[#f4f7fb] p-4 gap-6">

    <!-- LEVI PANEL (Banka Predmeta) - Soft UI (Solidna bela, nema lag) -->
    <aside class="w-80 flex flex-col bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- Zaglavlje levog panela -->
        <div class="p-5 border-b border-gray-100">
            <h2 class="text-lg font-bold text-gray-800">Bank predmeta</h2>
            <p class="text-xs text-gray-500 mt-1">Prevuci predmet na željeni datum</p>
            
            <!-- Polje za pretragu -->
            <div class="relative mt-4">
                <input type="text" placeholder="Pretraži predmete..." 
                       class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#34b9f7]/50 focus:border-transparent transition-all">
                <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Lista predmeta (Ovde ide ngFor) -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3" #draggableContainer>
            
            <!-- Primer 1: Predmet -->
            <div class="fc-event group cursor-grab active:cursor-grabbing p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md hover:border-[#34b9f7]/40 transition-all duration-200 flex flex-col gap-1 relative overflow-hidden">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-[#34b9f7]"></div>
                <h3 class="font-bold text-sm text-gray-800 group-hover:text-[#34b9f7] transition-colors">Osnove Programiranja</h3>
                <p class="text-xs text-gray-500 font-medium">Prof. dr Petar Petrović</p>
                <div class="mt-1">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-[#34b9f7]/10 text-[#34b9f7]">
                        1. Godina
                    </span>
                </div>
            </div>

            <!-- Primer 2: Predmet -->
            <div class="fc-event group cursor-grab active:cursor-grabbing p-4 bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-md hover:border-emerald-500/40 transition-all duration-200 flex flex-col gap-1 relative overflow-hidden">
                <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-500"></div>
                <h3 class="font-bold text-sm text-gray-800 group-hover:text-emerald-500 transition-colors">Strukture Podataka</h3>
                <p class="text-xs text-gray-500 font-medium">Prof. dr Marko Marković</p>
                <div class="mt-1">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-emerald-50 text-emerald-600">
                        2. Godina
                    </span>
                </div>
            </div>

        </div>
    </aside>

    <!-- DESNI PANEL (Kalendar Oblast) -->
    <main class="flex-1 flex flex-col min-w-0">
        
        <!-- Akciona Gornja Traka -->
        <header class="h-16 mb-6 px-6 flex items-center justify-between bg-white rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Raspored Kolokvijuma</h1>
                <!-- Zastavica za izmene -->
                <span class="px-3 py-1 bg-amber-50 border border-amber-100 text-amber-600 text-xs font-bold rounded-full flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse"></span>
                    Nesacuvane izmene
                </span>
            </div>
            
            <div class="flex items-center gap-3">
                <button class="px-4 py-2 text-sm font-semibold text-gray-600 bg-gray-50 border border-gray-200 rounded-xl hover:bg-gray-100 transition-all">
                    Sinhronizuj IMI
                </button>
                <button class="px-5 py-2 text-sm font-bold text-white bg-[#34b9f7] rounded-xl hover:bg-[#20a6e4] transition-all shadow-md">
                    Sačuvaj raspored
                </button>
            </div>
        </header>

        <!-- Kontejner za Kalendar -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 overflow-hidden flex flex-col">
            <full-calendar [options]="calendarOptions" class="h-full w-full"></full-calendar>
        </div>
    </main>

</div>
